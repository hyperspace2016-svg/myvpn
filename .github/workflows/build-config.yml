name: Build VPN config

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode VPN configuration
        run: |
          cat payload.part0 payload.part1 payload.part2a payload.part2b payload.part2c payload.part2d payload.part3 | base64 -d | gzip -d > YVJwAFf0xnPI.json
          test "$(sha256sum YVJwAFf0xnPI.json | cut -d' ' -f1)" = "7ed5d291c1bd45c47b3df3c3c546483f2c9fa51213c9a7971f71653361b401c3"
      - name: Commit decoded configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YVJwAFf0xnPI.json
          if ! git diff --cached --quiet; then
            git commit -m "Build VPN configuration"
            git push
          fi
