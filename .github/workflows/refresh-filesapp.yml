name: Refresh VPN from FilesApp
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            'https://app.filesapp.org/j/YVJwAFf0xnPI' \
            -o YVJwAFf0xnPI.json
          python -m json.tool YVJwAFf0xnPI.json >/dev/null
          echo "JSON bytes: $(wc -c < YVJwAFf0xnPI.json)"
          echo "JSON sha256: $(sha256sum YVJwAFf0xnPI.json | cut -d' ' -f1)"
      - name: Build Hiddify-safe list
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from urllib.parse import urlencode, quote

          with open('YVJwAFf0xnPI.json','r',encoding='utf-8-sig') as f:
              data=json.load(f)
          cfgs=data if isinstance(data,list) else [data]
          out=[]; seen=set()

          def add(p,k,v):
              if v is None: return
              if isinstance(v,(list,tuple)):
                  v=','.join(str(x) for x in v if x is not None)
              v=str(v)
              if v!='': p.append((k,v))

          for cfg in cfgs:
              if not isinstance(cfg,dict): continue
              for ob in cfg.get('outbounds',[]) or []:
                  if not isinstance(ob,dict) or ob.get('protocol')!='vless': continue
                  ss=ob.get('streamSettings') or {}
                  net=str(ss.get('network') or 'tcp').lower()
                  if net=='xhttp': continue
                  sec=str(ss.get('security') or 'none').lower()
                  tag=str(ob.get('tag') or 'VLESS')
                  for vn in ((ob.get('settings') or {}).get('vnext') or []):
                      if not isinstance(vn,dict): continue
                      addr=str(vn.get('address') or '').strip()
                      port=vn.get('port')
                      if not addr or port is None: continue
                      host=f'[{addr}]' if ':' in addr and not addr.startswith('[') else addr
                      for u in vn.get('users') or []:
                          if not isinstance(u,dict): continue
                          uid=str(u.get('id') or '').strip()
                          if not uid: continue
                          p=[]
                          add(p,'encryption',u.get('encryption') or 'none')
                          add(p,'flow',u.get('flow'))
                          add(p,'security',sec)
                          add(p,'type',net)
                          if sec=='reality':
                              r=ss.get('realitySettings') or {}
                              add(p,'sni',r.get('serverName'))
                              add(p,'fp',r.get('fingerprint'))
                              add(p,'pbk',r.get('publicKey'))
                              add(p,'sid',r.get('shortId'))
                          elif sec=='tls':
                              t=ss.get('tlsSettings') or {}
                              add(p,'sni',t.get('serverName'))
                              add(p,'fp',t.get('fingerprint'))
                              add(p,'alpn',t.get('alpn'))
                          if net=='ws':
                              w=ss.get('wsSettings') or {}
                              add(p,'path',w.get('path') or '/')
                              h=w.get('headers') or {}
                              add(p,'host',h.get('Host') or h.get('host'))
                          elif net=='grpc':
                              g=ss.get('grpcSettings') or {}
                              add(p,'serviceName',g.get('serviceName'))
                              if g.get('multiMode') is True:
                                  add(p,'mode','multi')
                          elif net=='tcp':
                              t=ss.get('tcpSettings') or {}
                              add(p,'headerType',(t.get('header') or {}).get('type') or 'none')
                          elif net=='httpupgrade':
                              h=ss.get('httpupgradeSettings') or {}
                              add(p,'path',h.get('path') or '/')
                              add(p,'host',h.get('host'))
                          link=f"vless://{uid}@{host}:{port}?{urlencode(p,doseq=True,safe='-_.~')}#{quote(tag,safe='-_.~')}"
                          if link not in seen:
                              seen.add(link); out.append(link)
          if not out:
              raise SystemExit('No non-XHTTP VLESS nodes found; refusing overwrite')
          with open('hiddify_subscription_safe.txt','w',encoding='utf-8',newline='\n') as f:
              f.write('\n'.join(out)+'\n')
          print('Hiddify-safe nodes:',len(out))
          PY
      - name: Commit files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add YVJwAFf0xnPI.json hiddify_subscription_safe.txt
          if git diff --cached --quiet; then
            echo 'Subscriptions already current.'
            exit 0
          fi
          git commit -m 'Refresh VPN subscriptions'
          git push
